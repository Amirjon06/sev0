name: sev0-lab

x-service: &service
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  environment: &service-env
    LOG_LEVEL: INFO
    CATALOG_URL: http://catalog:8001
    CART_URL: http://cart:8002
    PAYMENTS_URL: http://payments:8003
    GATEWAY_URL: http://gateway:8000

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: storefront
      POSTGRES_PASSWORD: storefront
      POSTGRES_DB: storefront
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storefront"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  catalog:
    <<: *service
    environment:
      <<: *service-env
      SERVICE_NAME: catalog
      SERVICE_MODULE: services.catalog.main:app
      PORT: 8001
    ports:
      - "8001:8001"

  cart:
    <<: *service
    environment:
      <<: *service-env
      SERVICE_NAME: cart
      SERVICE_MODULE: services.cart.main:app
      PORT: 8002
      DATABASE_URL: postgresql://storefront:storefront@postgres:5432/storefront
      DB_POOL_MAX_SIZE: 10
      DB_POOL_TIMEOUT: 5
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      catalog:
        condition: service_started

  payments:
    <<: *service
    environment:
      <<: *service-env
      SERVICE_NAME: payments
      SERVICE_MODULE: services.payments.main:app
      PORT: 8003
      PAYMENTS_DECLINE_RATE: 0.02
    ports:
      - "8003:8003"

  gateway:
    <<: *service
    environment:
      <<: *service-env
      SERVICE_NAME: gateway
      SERVICE_MODULE: services.gateway.main:app
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      - cart
      - catalog
      - payments

  loadgen:
    <<: *service
    environment:
      <<: *service-env
      SERVICE_NAME: loadgen
      LOADGEN_RPS: 4
      LOADGEN_CONCURRENCY: 4
    command: ["python", "-m", "loadgen.main"]
    depends_on:
      - gateway

  loki:
    image: grafana/loki:3.3.2
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.5.1
    user: root
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "12345:12345"
    depends_on:
      - loki
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_USERS_DEFAULT_THEME: dark
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/storefront.json
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

volumes:
  pgdata:
