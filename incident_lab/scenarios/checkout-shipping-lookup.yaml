id: checkout-shipping-lookup
title: Checkout 5xx after a shipping rates tidy-up
family: code
alert: checkout-5xx
difficulty: easy
tags: [crash, pricing]

summary: |
  A cleanup of the shipping rate lookup replaces the defaulted dict access
  with a direct subscript. Any shipping speed the table does not recognise
  now raises KeyError instead of falling back to standard. An older front
  end still sends "Express" with a capital E, so a slice of checkouts fail.

commit:
  author: Priya Raman <priya@storefront.example>
  message: |
    refactor(cart): Read the shipping rate directly

    The defaulted lookup implied the table might not contain the speed we
    were given, which has not been true since validation moved upstream.

edits:
  - file: services/cart/main.py
    find: |2
          chosen = speed or DEFAULT_SHIPPING_SPEED
          return SHIPPING_RATES.get(chosen, SHIPPING_RATES[DEFAULT_SHIPPING_SPEED])
    replace: |2
          chosen = speed or DEFAULT_SHIPPING_SPEED
          return SHIPPING_RATES[chosen]

rebuild: [cart]

failing_tests:
  - tests/test_pricing.py::TestShipping::test_an_unrecognised_speed_falls_back_rather_than_failing

ground_truth:
  service: cart
  file: services/cart/main.py
  symbol: shipping_cents
  summary: |
    SHIPPING_RATES is subscripted directly, so a speed outside the table
    raises KeyError. Real traffic contains differently-cased values.

notes:
  signal: |
    gateway 5xx rate rises. cart logs a KeyError naming the speed value,
    typically 'Express'.
  path: |
    Logs name the exception and the file. History shows the lookup changing
    just before onset.
  reproduction: |
    shipping_cents(1000, "Express") raises. The unrecognised-speed test
    fails.
