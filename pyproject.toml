[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sev0"
version = "0.1.0"
description = "An autonomous AI software engineer that diagnoses broken applications, repairs them, and proves the fix."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Amirjon Abdunayimov" }]
keywords = ["sre", "incident-response", "llm-agent", "root-cause-analysis", "devops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "httpx>=0.27.0",
    "pygit2>=1.15.0",
    "PyGithub>=2.5.0",
    "docker>=7.1.0",
    "structlog>=24.4.0",
    "opentelemetry-sdk>=1.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    # The demo storefront is not an installed package, but its modules are
    # imported directly by the tests, so its runtime deps belong here.
    "fastapi>=0.115.0",
    "prometheus-client>=0.21.0",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
]

[project.scripts]
sev0 = "sev0.cli:app"

[project.urls]
Homepage = "https://github.com/Amirjon06/sev0"
Issues = "https://github.com/Amirjon06/sev0/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sev0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["sev0", "services", "loadgen", "incident_lab"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
